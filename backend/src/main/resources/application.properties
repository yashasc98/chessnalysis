# ===============================
# Application
# ===============================
spring.application.name=chessnalysis-backend
server.port=8080

# ===============================
# Datasource
# ===============================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ===============================
# Logging
# ===============================
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO

# ===============================
# JWT
# ===============================
auth.jwt.secret=${JWT_SECRET:chess-nalysis-secret-key-min-256-bits-for-hs256-algorithm}
auth.jwt.expiration=${JWT_EXPIRATION:3600000}
auth.refresh-token.expiration=${REFRESH_TOKEN_EXPIRATION:604800000}
auth.refresh-token.length=32

# ===============================
# WebSocket
# ===============================
spring.websocket.message-broker.enabled=true